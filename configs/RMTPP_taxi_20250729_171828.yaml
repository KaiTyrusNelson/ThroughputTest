RMTPP_train:
  base_config:
    backend: torch
    base_dir: ./checkpoints/RMTPP/taxi/20250729_171828
    dataset_id: taxi
    model_id: RMTPP
    runner_id: std_tpp
    stage: train
  model_config:
    hidden_size: 128
    loss_integral_num_sample_per_step: 20
    thinning:
      dtime_max: 5
      look_ahead_time: 10
      num_exp: 500
      num_sample: 1
      num_samples_boundary: 5
      num_seq: 10
      num_step_gen: 1
      over_sample_rate: 5
      patience_counter: 5
  trainer_config:
    batch_size: 64
    early_stopping_patience: 20
    gpu: 0
    learning_rate: 0.001
    max_epoch: 300
    metrics:
    - acc
    - rmse
    optimizer: adam
    save_freq: 10
    seed: 2019
    shuffle: false
    use_tfb: false
    valid_freq: 5
data:
  taxi:
    data_format: pkl
    data_specs:
      num_event_types: 10
      pad_token_id: 10
      padding_side: right
      truncation_side: right
    test_dir: data/taxi/taxi/test.pkl
    train_dir: data/taxi/taxi/train.pkl
    valid_dir: data/taxi/taxi/dev.pkl
pipeline_config_id: runner_config
